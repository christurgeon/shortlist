# Pre-registered validation parameters for the edgar:form4_insider_buy signal
# (opportunistic-insider Form 4 buys, Cohen-Malloy-Pomorski JF 2012 routine/opportunistic
# split; drift capture, not an information edge — Form 4 is public T+2 and every vendor
# parses it instantly. Design: docs/FORM4_INSIDER.md).
#
# Committed BEFORE any backfill/eval run -- the anti-p-hacking guard. The evaluator verifies
# this file's git commit time against the run as_of and flags the verdict non-preregistered
# if edited after. Fixing ALL of these here (not in config.yaml) is the guard (spec §7/F7).
signal: edgar:form4_insider_buy
as_of: 2026-07-26
window_start: 2022-01-01
window_end: 2025-12-31
verdict_as_of: 2026-03-31        # window_end + K; earlier runs are labelled INTERIM
k_months: 3                      # insider drift is measurable at a quarter
factor_model: ff3
weighting: equal
min_measurable_frac: 0.90        # CHECK THIS BEFORE READING ANY ALPHA (audit 2026-07-26 §5)
min_independent_blocks: 8
min_bucket_events: 5
delisting_return: -0.55
regime_down_rule: spy_trailing_3m_negative
expected_sign: positive          # Cohen-Malloy-Pomorski 2012; Lakonishok-Lee 2001
