# Each threshold is [low, high]: the metric is mapped linearly to 0..100 over
# this range and clamped. Returns/margins are FRACTIONS (0.20=20%). A [high, low]
# pair is INVERTED — less is better.
#
# Every band and number in this file is an UNFITTED prior unless a comment says
# otherwise; backtest a leg's standalone rank IC before trusting it. Legs marked
# "backtest axis only" have no production reader (docs/SCORING.md).

thresholds:
  # Quality
  roe:                 [0.10, 0.35]
  net_margin:          [0.00, 0.30]
  interest_coverage:   [2.0, 15.0]
  debt_to_equity:      [3.0, 0.0]      # inverted
  net_debt_to_ebitda:  [6.0, 0.0]      # backtest axis only; inverted

  # Moat proxies
  gross_margin:            [0.20, 0.70]
  gross_margin_stability:  [0.50, 1.00]
  roic:                    [0.05, 0.30]

  # Growth (fundamental compounding)
  revenue_cagr:                [0.00, 0.20]
  fcf_cagr:                    [0.00, 0.20]
  eps_cagr:                    [0.00, 0.20]
  revenue_growth_persistence:  [0.50, 1.00]

  # Momentum
  price_vs_200dma:     [-0.10, 0.30]
  rel_strength_6m:     [-0.15, 0.25]
  eps_revision:        [-0.05, 0.10]
  sue:                 [-2.0, 2.0]   # decayed surprise / own sigma; feeds momentum.sue
  residual_momentum:   [-1.0, 1.0]   # CAPM-residual 12-1 momentum / residual vol; feeds momentum.residual
  # Measurement axes, backtest only.
  pct_to_52w_high:     [0.70, 1.00]
  max_daily_return:    [0.15, 0.02]  # inverted
  vol_scaled_momentum: [0.0, 2.0]

  # Value
  upside_to_target:    [0.00, 0.40]
  fcf_yield:           [0.02, 0.08]
  ebit_ev_yield:       [0.04, 0.12]    # backtest axis only
  pe_vs_history:       [-0.20, 0.30]   # positive = cheaper than own 5y median
  peg:                 [3.0, 0.5]      # inverted

  # Fraction of Piotroski-inspired tests won. Backtest axis; also drives the
  # value_trap suppress/confirm refinement.
  piotroski_f:         [0.34, 1.00]

  # Insider
  insider_sentiment:   [-0.30, 0.30]
  insider_net_ratio:   [-0.0005, 0.0005]   # net insider $ / market cap

  # Inert unless the insider.conviction block below is present.
  insider_cluster:        [1, 4]        # distinct qualifying buyers
  insider_role_buy_ratio: [0.0, 0.001]  # role-weighted buy $ / market cap

  # Risk (safer -> higher score)
  realized_vol:   [0.45, 0.15]    # annualized stdev of daily returns
  max_drawdown:   [-0.50, -0.10]  # trailing ~1y peak-to-trough (negative)

  # Feeds the opt-in quality.dilution leg and the dilution flag.
  share_count_cagr: [0.04, -0.04]   # +dilution -> 0 ; -buyback -> 100

  # Backtest axes + the opt-in quality.earnings_quality legs.
  asset_growth: [0.30, -0.10]
  accruals:     [0.15, -0.15]

  # Backtest axis + the opt-in value.shareholder_yield leg.
  shareholder_yield: [-0.02, 0.10]

# Only ratios matter: the composite is a weighted average over the components present.
weights:
  quality:      0.18
  moat:         0.18
  growth:       0.135
  value:        0.22
  momentum:     0.08
  insider:      0.135
  # 0.0, NOT deleted: the risk sub-score is still computed and displayed; it just
  # carries no composite weight. Deleting the key would also hide it.
  # docs/audits/2026-09-25-risk-tilt-disable.md
  risk:         0.0

gates:
  # An investability mandate, not an alpha claim, and not a liquidity proxy: cap says
  # nothing about dollar volume. docs/audits/2026-08-07-investability-floor.md
  min_market_cap:          3.0e+8
  max_debt_to_equity:      5.0
  min_insider_sentiment:  -0.60   # trips "heavy_insider_selling" below this
  # Net-debt/EBITDA primary; D/E fallback when EBITDA is unavailable or untrustworthy.
  # Removing the block restores the plain raw-D/E gate.
  leverage:
    enabled: true
    max_net_debt_to_ebitda:         4.0
    min_ebitda_margin:              0.03  # below this EBITDA is too small to trust -> fall back to D/E
    dte_artifact_ceiling:           20.0  # D/E above this is an equity-distortion artifact -> abstain
    min_interest_coverage_for_gate: 2.0   # fallback trips only when EBIT covers interest by less than this
  # A negative-FCF name is excused when growth is strong AND sustained. Removing the
  # block restores the hard gate.
  fcf:
    enabled: true
    excuse_min_revenue_cagr:  0.15
    excuse_min_persistence:   0.70

# Sector applicability (SIC -> bucket). Masks legs/gates that are structurally
# undefined for spread/deposit/property businesses; surviving bands are not
# recalibrated. `buckets` is ORDERED: the first bucket whose inclusive SIC range
# contains the code wins. Unknown SIC -> no masking.
sectors:
  buckets:
    - name: reit
      sic_ranges: [[6798, 6798]]
    - name: insurer
      sic_ranges: [[6300, 6399], [6411, 6411]]
    - name: financials
      sic_ranges: [[6020, 6099], [6120, 6179], [6199, 6199], [6211, 6211], [6712, 6712]]
  # Masking is production-only: backtest axes stay unmasked for raw-IC comparability.
  # net_margin is deliberately NOT masked (defined, only miscalibrated). Exchanges,
  # advisers, funds, SPACs and real-estate operators are not bucketed.
  masked_legs: [gross_margin, gross_margin_stability, roic, fcf_yield, fcf_cagr, interest_coverage, debt_to_equity, piotroski_f, asset_growth, accruals, shareholder_yield]
  masked_gates: [negative_fcf, over_leveraged]

validity:
  # Floors apply only to known buckets; 'unknown' scores on any present leg.
  min_valid_leg_fraction: 0.5   # a known-bucket sub-score needs this share of its applicable legs
  unknown_min_present_legs: 1
  min_scored_weight:      0.25  # known-bucket composite is 'scored' iff present/applicable weight >= this
  # All buckets. A composite must rest on at least this many real sub-scores (`risk`
  # does not count), so a card with every component null stays unscored. A COUNT, not
  # a weight: a momentum-only name has low confidence yet must still score, so no
  # weight threshold separates the two. Removing the key disables the floor.
  min_composite_components: 1

# Advisory only: no flag may touch passed / composite / scored.
flags:
  crowded_short:                      # needs the `finra` source
    min_short_pct_outstanding: 0.10   # of shares OUTSTANDING — under-states float
    min_days_to_cover: 5.0
    require_rising: true              # the change vs the prior cycle is the signal
    max_staleness_days: 35            # stale-cache guard
  # Inert unless insider.conviction is enabled.
  insider_cluster_buy: { min_distinct: 3 }
  planned_sale:        { min_value: 1 }
  cash_burn:           { enabled: true }   # fires whenever FCF is negative
  dilution:            { min_share_cagr: 0.03 }   # diluted-share growth per year
  # Looks cheap while quality OR growth is weak. Level-based: no trend without history.
  value_trap:
    min_value_score:   60
    max_quality_score: 40
    max_growth_score:  40
    # Optional Piotroski refinement; absent by default.
    # piotroski:
    #   suppress_at: 0.83   # cheap + fraction >= this -> NOT a trap. Kept high on purpose:
    #                       # suppression removes a risk flag, so it needs the F4-F6 trend legs.
    #   confirm_at:  0.40   # cheap + fraction <= this -> trap even if quality/growth are ok
    #   min_legs:    4      # abstain when fewer of the 6 tests are evaluable
  social_hype:                  # WSB via ApeWisdom
    min_mentions: 50            # retune by regime
    min_mention_delta_pct: 0.5  # skipped when there is no 24h baseline
    require_rising: true
    max_staleness_days: 2
  news_spike:                   # Finnhub company-news
    min_count_7d: 10
    require_rising: true        # last-7d count must exceed the prior 7d
    max_staleness_days: 3
  # DISABLED: it has never been able to fire. No producer writes
  # StockMetrics.filing_text_similarity (research runs after check_flags), and the
  # metric barely discriminates (textsim.py keeps stopwords). Both must be fixed to
  # re-enable. Kept so the threshold and the kill reason stay together.
  # TODO.md §2a, docs/audits/2026-08-21-inventory-context-line.md,
  # tests/test_flag_producers.py
  filing_text_change:
    enabled: false
    max_similarity: 0.7        # similarity below this -> flag
  # cyclical_buckets ships EMPTY: sectors.buckets defines no cyclical bucket, so a
  # cyclical name resolves to "unknown" and would never match.
  risk_off_regime:
    max_net_debt_ebitda: 3.0
    max_debt_to_equity: 1.5
    cyclical_buckets: []

fmp:
  # The insider endpoint is paid (402 on free plans) and EDGAR is the free source.
  # Enable only on a paid tier.
  fetch_insider: false
  # Retries on a per-minute 429; daily-quota 429s won't clear, so keep this small.
  max_retries: 2

# ---------------------------------------------------------------------------
# OPT-IN SCORING LEGS
#
# Each block below is a scoring leg that is OFF unless written here.
#   1. Commented out (or `enabled: false`) => the scorer behaves exactly as without the
#      feature. The signal is still surfaced and backtest-measured; only SCORING changes.
#   2. Backtest the leg's standalone rank IC, and its collinearity with neighbouring
#      legs, before enabling it.
#   3. ONE top-level key per name. Two `value:` blocks are valid YAML that silently
#      keeps only the last; write one `value:` key with two children. Same for
#      `quality:` and `momentum:`.
# ---------------------------------------------------------------------------

# Insider conviction: cluster-buy and role-weighted-buy legs, and the insider_* flags.
# insider:
#   conviction:
#     enabled: true
#     min_cluster_buy_value: 25000      # per-buyer $ floor to count toward a cluster
#     planned_sell_discount: 0.5        # forgive this share of detected-10b5-1 sell drag
#     role_weights:
#       c_suite:  1.5
#       officer:  1.2
#       director: 1.0
#       ten_pct:  0.5
#       unknown:  1.0                   # missing role == neutral

# Dilution scoring: an inverted share_count_cagr quality leg, and growth eps_cagr
# switches from the net-income proxy to diluted-EPS CAGR.
# CAVEAT: accumulated snapshots from before the companyconcept fallback lack
# `diluted_shares` for some large caps (docs/PLAN_EDGAR_ROOT_CAUSE_B.md). Exclude them
# before fitting on accumulated history.
# quality:
#   dilution:
#     enabled: true

# Both legs are measured and OFF; they stay backtested. Per-leg keys default True when
# absent. docs/audits/2026-07-12-accruals-leg-disable.md
quality:
  earnings_quality:
    enabled: true
    asset_growth: false
    accruals: false

# The one OPT-OUT knob: rule 1 runs backwards here. It ships ON and leaving this
# commented KEEPS it on. Set `enabled: false` only to run a counterfactual; value then
# rests on fcf_yield / pe_vs_history / peg and the weight redistributes.
# `thresholds.upside_to_target` stays required either way.
# value:
#   upside_to_target:
#     enabled: false

# Total shareholder yield: one straight value leg, so a net debt ISSUER scores below 0%.
# value:
#   shareholder_yield:
#     enabled: true

# Post-earnings drift: one straight momentum leg from the decayed, standardized last
# surprise. It ABSTAINS below min_quarters usable surprises or below sigma_floor
# dispersion (sigma~0 would divide to inf/NaN). Decay runs from the last ANNOUNCED
# report (earnings_days_since_last_report), never days-to-next, which would be look-ahead.
# momentum:
#   sue:
#     enabled: true
#     decay_trading_days: 60
#     sigma_floor: 1.0           # surprise dispersion, percentage points
#     min_quarters: 3

# Residual momentum is ON (the exception to rule 2): short-horizon (past ~3 months the
# edge decays), so a de-betaed near-term tilt, not a long-hold thesis. Abstains on a
# thin, flat or date-less price window.
momentum:
  residual:
    enabled: true

# Default source chain for the harness; yahoo first wins the price merge. Passing
# `--provider` overrides this list entirely, so omit it to keep yahoo/finra.
harness_sources: [yahoo, fmp, finnhub, edgar, finra, wsb, gov_contracts, lobbying]

# HTTP-response cache for the FMP/Finnhub sources. Disable per run with --no-cache;
# force-repopulate with --refresh-cache. docs/DATA_SOURCES.md §6.
cache:
  enabled: true
  path: .cache/http.sqlite
  # ttl: {<bucket>: <seconds>} overrides cache.py:_DEFAULT_TTLS. Omitted so the
  # defaults stay the single source; add only buckets you retune.

# Qualitative research layer (shortlist --research N). Uses the `claude` CLI.
#
# Two rules cover every sub-block:
#   1. `enabled: false` (or deleting the block) omits its line from the prompt.
#   2. These are PROMPT-ONLY context lines, never a sub-score, gate or flag: research
#      runs after score(). `eightk`, `tenq_risk_update` and `notes` carry real FILING
#      TEXT, so each enters the quote-grounding haystack as its own labelled segment
#      (docs/RESEARCH.md → Quote verification).
research:
  model: claude-sonnet-5-5     # a judgment call, not a measurement. SYSTEM_PROMPT was tuned
                               # on an earlier generation; watch for over-applied length/scope
                               # directives. Reproducibility rests on the cache key
                               # (research/cachekey.py), not this string.
  timeout_s: 900               # heavy filers need several minutes. Keep max_attempts x
                               # timeout_s below bot.research_phase_budget_s.
  max_attempts: 3              # total assess() tries; a claude call can transiently time out
  fallback_model: claude-opus-5   # --fallback-model on the claude CLI; MUST DIFFER from `model`
                               # to do anything. The brief is labelled with the model that
                               # actually ran (claude_cli._answering_model). Remove the key
                               # to omit the flag.
  output_root: research        # artifacts: research/<TICKER>/<key>.{md,json}, keyed by the
                               # wide cache key (research/cachekey.py), not the accession
  cache:                       # brief staleness (docs/PLAN_DEEP_FRESHNESS.md §4)
    max_age_days: 1            # day bucket; 0 = content-addressed only, no time decay. 0
                               # also freezes the macro line: only `macro.regime` is hashed,
                               # but the line prints rate levels that can move without it.
    price_band_pct: 0.03       # regenerate when price/market cap moves this much. 0 drops
                               # price/market_cap from the digest entirely (price never
                               # busts the key), NOT "bust on any move".
  max_risks: 12
  max_red_flags: 12
  max_conflicts: 6
  max_moat_sources: 6          # quoted claims, so uncapped growth eats OUTPUT tokens; assess.py
  max_management_findings: 6   # drops the brief, unretried, on stop_reason == max_tokens
  max_falsifiers: 6
  max_added_risks: 8
  risk_diff:                   # YoY Item-1A risk-factor diff (research/riskdiff.py)
    similarity_threshold: 0.5  # below => block counts as "added"
    max_blocks: 4
    max_chars: 12000
  max_chars:                   # per-section caps on 10-K text fed to the model
    business: 50000
    mda: 60000
    risk_factors: 50000        # boilerplate ordered worst-first, so a prefix keeps the material risks
    tenq_mda: 40000            # also load-bearing against whole-document over-capture in the
                               # 10-Q MD&A extraction. TODO.md §2a
  tenq_risk_update:            # 10-Q Part II Item 1A changes, diffed against the 10-K Item 1A
    enabled: true              # (research/filings.py:_tenq_added_risks)
    max_blocks: 4
    max_chars: 4000            # a cap on the diff, not the raw Item 1A, which can be far larger
  notes:                       # debt & liquidity statement notes (research/notes.py): the
                               # maturity-ladder input for the refinancing-coverage arithmetic.
                               # docs/audits/2026-08-20-debt-liquidity-notes-design.md
    enabled: true
    max_notes_per_form: 2      # a borrower can file several relevant notes
    max_chars_per_note: 16000  # not lower: the ladder can sit past 10,000 chars, and a tighter
                               # cap would silently drop it for heavy borrowers
    max_chars_10k: 16000       # per-form budgets, not a shared pool, so annual notes cannot
    max_chars_10q: 8000        # crowd out the fresher quarterly note
  screening_call:              # buy/hold/avoid capstone on the research brief
    enabled: true
    labels:
      STRONG_BUY: "Strong Buy"
      BUY: "Buy"
      HOLD: "Hold"
      AVOID: "Avoid"
      STRONG_AVOID: "Strong Avoid"
    disclaimer: "screen only — not advice"  # tag on every standalone surface
    gate_clamp:                # gate name -> most-bullish stance allowed when tripped
      _default: HOLD
      negative_fcf: AVOID
      over_leveraged: AVOID
    conviction_cap:
      low_below: 0.45          # confidence below this -> LOW
      medium_below: 0.70       # confidence below this -> at most MEDIUM
    high_conviction:
      contra_flags: [value_trap]  # flags that block HIGH on a bullish call
  reverse_dcf:                 # price-implied FCF growth line
    enabled: true
    discount_rate: 0.10        # cost-of-equity prior; the only model knob
    base_years: 3              # FCF normalization window (median of positive years)
    run_rate_flag_ratio: 1.5   # flag the line when latest FCF > this x base
    display_floor: -0.50       # clamp display; below => "distressed/special-situation"

  inventory:                   # inventory balance + days-inventory-outstanding trend. Does NOT
                               # compute "FCF excluding the inventory build": that adjustment
                               # is not neutral (docs/PLAN_INVENTORY_DECOMPOSITION.md §0.2, §1).
                               # The DIO leg needs gross_profit (year-joined from FMP), so it
                               # abstains when FMP is gated and only the balance trend renders.
    enabled: true

  gov_contracts:               # USAspending gov-contracts context line
    enabled: true
    min_confidence: 0.80       # omit the line below this recipient-match confidence

  lobbying:                    # federal lobbying-spend context line
    enabled: true
    min_confidence: 0.85       # omit the line below this client-match confidence

  earnings:                    # earnings-surprise history + next-report line
    enabled: true

  analyst_revision:            # change in sell-side rating counts. DELTAS ONLY, never a prior
                               # level: `analyst` merges across sources, so a level could come
                               # from a different vendor's panel than the delta.
    enabled: true

  options:                     # options-surface context line. NOT on /screen and NOT in
                               # harness_sources: /screen would spend the per-IP budget on data
                               # no screen renders. Feed, guards and constants:
                               # docs/audits/2026-08-24-options-surface-design.md
    enabled: true
    timeout: 20                # seconds; a slow chain must never stall a brief
    delta_tolerance: 0.10      # reject a strike whose ACHIEVED delta is this far from target.
                               # Not a minimum contract count: that passes thin chains, which
                               # produce the worst skews.
    max_atm_spread_pct: 40     # reject the STRADDLE above this bid-ask % of mid. Gates the
                               # implied move only; skew compares volatilities and survives
                               # a wide spread.
    # The next three bracket the expiry around the print. The vendor revises still-future
    # earnings dates, so an expiry chosen without a buffer can land BEFORE the print and
    # price no event while the line claims it does. Abstaining is better. Revisions stop
    # shortly before the print, hence the firm-within window.
    earnings_date_uncertainty_days: 8  # expiry must sit >= this far AFTER the predicted date
    max_earnings_expiry_gap_days: 14   # ...and no further, or it prices extra drift. A print
                               # far out usually has no bracketing expiry and the clause abstains.
    earnings_date_firm_within_days: 7  # inside this, take the date at face value, no buffer
    earnings_lookback_quarters: 6      # realized post-announcement moves shown beside the implied one
    max_stale_days: 5          # abstain when the QUOTE time (not the file timestamp) is older
    require_in_thesis: true    # attach OPTIONS_SYSTEM_ADDENDUM, which REQUIRES the brief to
                               # account for the line in `thesis`; a clause with no named
                               # destination field is ignored. Do not soften the addendum's
                               # wording without re-running the A/B in
                               # docs/audits/2026-08-25-options-line-destination-verdict.md

  durability:                  # "ROIC persistence" section (research/durability.py): a measured
                               # historical frequency on SEC facts, DISPLAY ONLY, never scored
                               # and never shown to the model.
                               # docs/audits/2026-10-04-moat-durability-verdict.md
    enabled: true              # at most one sec.gov request per brief (day-cached)
    max_table_gap_years: 1     # abstain when the fiscal year is further than this past the
                               # table's reference year; 0 = that year only. Don't raise it to
                               # keep an old table alive (docs/RESEARCH.md).
    cache_dir: .cache/durability-live
    deadline_s: 15             # wall-clock bound on the request; values above 45 are read as 45
                               # to fit the research phase budget
  insider_detail:              # recent Form-4 trades as a brief context line
    enabled: true
    max_items: 6               # newest-first

  macro:                       # run-level macro backdrop line from the already-fetched
                               # MacroContext. Fixed template, not free text.
    enabled: true

  eightk:                      # recent 8-K substance (research/eightk.py). EXCEPTION to rule 2:
                               # filing text, entering the grounding haystack as its own labelled
                               # segment so a verified quote is attributed to the 8-K, not the
                               # 10-K. docs/audits/2026-08-13-eightk-text-in-deep-design.md
    enabled: true
    lookback_days: 120         # on the dedicated form="8-K" index, NOT m.filing_events, whose
                               # mixed index can age out an Item 2.02 release
    max_filings: 3
    max_chars_total: 10000     # normalized chars, after whitespace-collapse; higher values
                               # push heavy filers toward timeout_s
    max_chars_per_filing: 6000 # binds on most earnings releases BY DESIGN: the goal is what is NEW
    guidance_window_chars: 1500  # spliced around a late outlook/guidance hit the prefix would
                               # lose. A heuristic and a trade: it displaces prefix chars inside
                               # the same cap. 0 drops it.
    items: ["4.02", "2.02", "2.01", "1.01", "5.02"]   # priority order, best-first; 4.02 (non-reliance
                               # restatement) outranks the rest. An 8-K with none keeps its bare form label.

  proxy:                       # DEF 14A compensation & governance line from structured XBRL,
                               # fetched per deep-dive, not per screen
    enabled: true
    max_holders: 3             # 5%+ beneficial holders named, largest-first
    control_pct: 30.0          # a holder >= this (percent units) triggers the concentrated-control note

# Government contracts (GovContractsSource, USAspending). Keyless; data + research
# context line only, no sub-score or flag.
gov_contracts:
  trailing_months: 24
  match_min_confidence: 0.80   # validated against tests/test_govcontract_match.py
  max_pages: 5                 # page cap on spending_by_transaction (sorted by amount desc)
  cache_dir: .cache/usaspending
  timeout: 20

# Federal lobbying (LobbyingSource, Senate LDA). Keyless; data + research context line
# only, no sub-score or flag.
lobbying:
  base_url: https://lda.gov/api/v1
  trailing_months: 24
  match_min_confidence: 0.85   # client.name vs SEC registrant title
  max_pages_per_year: 4        # 25 filings per page
  cache_dir: .cache/lda
  timeout: 20

# EDGAR filing-stream events (EdgarSource). Advisory flags only.
edgar_events:
  lookback_days: 90
  # The slice is taken newest-first BEFORE the lookback filter, so a high-frequency
  # filer's routine 144/13G stream can crowd a rare event out of the window. The slice
  # is in-memory, so raising this costs no requests; the very heaviest filers still truncate.
  index_limit: 120
  # /A amendments are auto-included by edgartools. SCHEDULE 13D/13G spellings are listed
  # explicitly because the fetch filter is exact-match. 10-Q/10-K feed only the SUE decay
  # anchor (events.last_report_filed); they never join the advisory `recent` list.
  forms: ["8-K", "SC 13D", "SC 13G", "144", "SCHEDULE 13D", "SCHEDULE 13G", "10-Q", "10-K",
          # Distress / dilution / accounting-integrity forms. They ride the same
          # submissions index, so they cost no extra request. Form 25 / 25-NSE are
          # deliberately absent: nearly always a matured note or warrant, not the issuer.
          # See data/sources/edgar.py.
          "NT 10-K", "NT 10-Q", "S-3", "S-3ASR", "424B5", "UPLOAD", "CORRESP"]

# Telegram bot (shortlist-bot).
bot:
  poll_timeout_s: 25        # getUpdates long-poll seconds
  max_screen: 10            # max tickers per /screen
  max_deep: 3               # max tickers per /deep (each is a Claude call)
  deep_screen_sources: [yahoo, fmp, finnhub, edgar, finra, wsb]
  research_top_n: 3             # names sent to the research layer per /deep
  research_phase_budget_s: 2800 # wall-clock ceiling for the whole research phase

ranking:
  thin_below: 0.40  # mark a card "thin" when confidence < this. Omit/null to disable.

# Run-level macro/credit-regime overlay via FRED (needs a free FRED_API_KEY; the keyless
# host is IP-blocked on datacenter IPs). Display + advisory only. See data/macro.py.
macro:
  enabled: true
  series:
    dgs10: DGS10            # 10y treasury yield (%)
    t10y2y: T10Y2Y          # 2s10s curve (%)
    hy_oas: BAMLH0A0HYM2    # ICE BofA US HY OAS (%)
    vix: VIXCLS
    fedfunds: FEDFUNDS      # fed funds (%)
  risk_off: { hy_oas: 5.0, t10y2y: 0.0, vix: 25.0 }   # any one trips risk-off
  risk_on:  { hy_oas: 3.5, vix: 18.0 }

# Portfolio awareness (bot /portfolio).
portfolio:
  store: positions.json    # bot-owned source of truth (gitignored); atomic writes
  decisions: decisions.jsonl   # append-only decision ledger (gitignored)
  max_holdings: 50         # safety cap; over this, screen the cap + WARN (never silent-drop)
