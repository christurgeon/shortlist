# Each threshold is [low, high]: the metric is mapped linearly to 0..100 over
# this range and clamped. Tune to taste. Returns/margins are FRACTIONS (0.20=20%).

thresholds:
  # Quality
  roe:                 [0.10, 0.35]
  net_margin:          [0.00, 0.30]
  interest_coverage:   [2.0, 15.0]
  debt_to_equity:      [3.0, 0.0]      # inverted: less leverage scores higher
  net_debt_to_ebitda:  [6.0, 0.0]      # backtest axis ONLY (inverted: less leverage -> higher)

  # Moat proxies
  gross_margin:            [0.20, 0.70]
  gross_margin_stability:  [0.50, 1.00]
  roic:                    [0.05, 0.30]

  # Growth (fundamental compounding)
  revenue_cagr:                [0.00, 0.20]
  fcf_cagr:                    [0.00, 0.20]
  eps_cagr:                    [0.00, 0.20]
  revenue_growth_persistence:  [0.50, 1.00]

  # Momentum
  price_vs_200dma:     [-0.10, 0.30]
  rel_strength_6m:     [-0.15, 0.25]
  eps_revision:        [-0.05, 0.10]
  # SUE / post-earnings-announcement drift (PREDICTIVE_SIGNALS §1; Bernard-Thomas 1989).
  # The decayed, dispersion-standardized earnings surprise (last_surprise_% / own-σ),
  # NOT inverted (a fresh beat scores high). Feeds the BACKTEST axis (sue) and the opt-in
  # momentum.sue leg below. UNFITTED prior — backtest standalone rank IC before trusting.
  sue:                 [-2.0, 2.0]   # SUE -2σ (big miss) -> 0 ; +2σ (big beat) -> 100
  # Residual (idiosyncratic) momentum (PREDICTIVE_SIGNALS §2; Blitz-Huij-Martens 2011).
  # 12-1 momentum of CAPM (vs SPY) residuals, standardized by residual vol — NOT inverted
  # (a strong de-betaed uptrend scores high). Feeds the BACKTEST axis (residual_momentum,
  # LIVE-price) and the opt-in momentum.residual leg below. UNFITTED prior — backtest the
  # standalone rank IC + its collinearity vs raw momentum before trusting.
  residual_momentum:   [-1.0, 1.0]   # vol-scaled iMOM -1 -> 0 ; +1 -> 100
  # PREDICTIVE_SIGNALS §2 price-refinement MEASUREMENT axes — UNFITTED PRIORS, backtest-only
  # (no production leg reads these). pct_to_52w_high NOT inverted; max_daily_return INVERTED.
  pct_to_52w_high:     [0.70, 1.00]  # 70% of 52wk-high -> 0 ; at the high -> 100 (George-Hwang)
  max_daily_return:    [0.15, 0.02]  # INVERTED: 15% lottery spike -> 0 ; calm 2% -> 100 (Bali MAX)
  vol_scaled_momentum: [0.0, 2.0]    # risk-adjusted 12-1 momentum 0 -> 0 ; 2.0 -> 100 (Barroso-Santa-Clara)

  # Value
  upside_to_target:    [0.00, 0.40]
  fcf_yield:           [0.02, 0.08]
  # EV/EBIT earnings yield (EBIT/EV; higher = cheaper). UNFITTED prior: ~4% yield
  # -> 0, ~12%+ -> 100 (Greenblatt-cheap territory). Backtest-measured only; no
  # production sub-score reads this yet (spec §2.2 / 2026-06-13 design §9).
  ebit_ev_yield: [0.04, 0.12]
  pe_vs_history:       [-0.20, 0.30]   # positive = cheaper than own 5y median
  peg:                 [3.0, 0.5]      # inverted: lower PEG scores higher (growth at a discount)

  # Fundamental-quality (Piotroski-inspired fraction won/legs -> 0..100). Used by the
  # BACKTEST axis and to derive the value_trap suppress/confirm fraction. UNFITTED
  # prior — backtest standalone IC before trusting (like the risk axis).
  piotroski_f:         [0.34, 1.00]

  # Insider
  insider_sentiment:   [-0.30, 0.30]
  insider_net_ratio:   [-0.0005, 0.0005]   # net insider $ / market cap

  # Insider conviction (UNFITTED priors — backtest standalone rank IC before trusting,
  # like the risk axis). Only used when the insider.conviction block below is present.
  insider_cluster:        [1, 4]        # # distinct qualifying buyers -> 0..100
  insider_role_buy_ratio: [0.0, 0.001]  # role-weighted buy $ / market cap -> 0..100

  # Risk (inverted: safer -> higher score). Unfitted prior — backtest before trusting.
  realized_vol:   [0.45, 0.15]    # annualized stdev of daily returns
  max_drawdown:   [-0.50, -0.10]  # trailing ~1y peak-to-trough (negative)

  # Dilution / share-count trend (inverted: net buybacks score higher than net
  # issuance). Feeds the opt-in quality dilution leg AND the dilution advisory flag.
  # UNFITTED prior — backtest standalone rank IC before trusting (like risk).
  share_count_cagr: [0.04, -0.04]   # +4%/yr dilution -> 0 ; -4%/yr buyback -> 100

  # Investment & earnings-quality fundamentals (PREDICTIVE_SIGNALS §3). Both INVERTED
  # (high -> lower score): asset balloon / soft accruals score low. Feed the BACKTEST
  # axes (asset_growth / accruals) and the opt-in quality.earnings_quality legs below.
  # UNFITTED priors — backtest standalone rank IC before trusting (like risk/dilution).
  asset_growth: [0.30, -0.10]   # +30%/yr asset growth -> 0 ; -10% (shrinking) -> 100
  accruals:     [0.15, -0.15]   # high accruals -> 0 ; strongly cash-backed -> 100

  # Total shareholder yield (PREDICTIVE_SIGNALS §5; Boudoukh et al. 2007 / Faber): a
  # POSITIVE predictor scored STRAIGHT (not inverted): (dividends + net buybacks + net
  # debt reduction) / market_cap. Feeds the BACKTEST axis (shareholder_yield) and the
  # opt-in value.shareholder_yield leg below. A net debt issuer can score < 0% yield.
  # UNFITTED prior — backtest standalone rank IC + collinearity before trusting.
  shareholder_yield: [-0.02, 0.10]   # -2%/yr (net issuer) -> 0 ; +10%/yr payout -> 100

weights:
  quality:      0.18   # was 0.20 (x0.9 on risk-axis introduction)
  moat:         0.18   # was 0.20
  growth:       0.135  # was 0.15 — fundamental compounding (revenue/FCF/EPS CAGR + persistence)
  value:        0.22   # value-tilt: independent leg (was inside opportunity's 0.27 max)
  momentum:     0.08   # independent leg; value pulls ~3x momentum
  insider:      0.135  # was 0.15
  risk:         0.10   # NEW — vol/drawdown tilt; composite-only, excluded from confidence
  # NOTE: a defensible prior, not a fitted result. The risk weight especially:
  # trailing vol/drawdown peak at the bottom and can be anti-predictive at turning
  # points — backtest its standalone rank IC (docs/ASSESSMENT_GAPS.md §2.1, §2.9)
  # before trusting these weights.

gates:
  # LOWERED 2026-08-07 from 2.0e+9 to 3.0e+8. This is an INVESTABILITY MANDATE, not an alpha
  # claim -- no backtest says $300M outperforms $2B, and none is asserted.
  #
  # At $2B the gate was mismatched to the funnel feeding it: edgar:activist_13d's MEDIAN pick
  # is $50M, and ~80% of deep-screen slots went to names this gate was configured to reject
  # (52 of 54 13D picks gated). Activism and insider buying structurally happen at small caps
  # -- that is what the enabled originators are built to find -- so a $2B floor did not filter
  # a tail, it deleted the distribution: 13 of 25 sessions would deliver nothing.
  #
  # $300M sits inside the $0.3-10B band docs/audits/2026-07-26-funnel-composition-audit.md
  # identifies as retail-accessible, and keeps 46% of picks across 19 of 25 sessions. The
  # untradeable tail below it is not filtered elsewhere any more
  # (a $100M cap floor plus a $500k/day DOLLAR-volume floor), so this gate no longer has to
  # double as a liquidity proxy -- which it was always bad at, since cap does not tell you
  # whether a $200M name trades $600k/day or $30k/day.
  #
  # Reversible in one line, and measurable: the selection ledger records what surfaces, so
  # this becomes a checkable decision rather than a permanent bet. Evidence + the full
  # floor-sensitivity curve: docs/audits/2026-08-07-investability-floor.md.
  min_market_cap:          3.0e+8
  max_debt_to_equity:      5.0
  min_insider_sentiment:  -0.60   # trip "heavy_insider_selling" below this
  # Leverage gate (ASSESSMENT_GAPS §2.7). Shipped ON. Net-debt/EBITDA primary;
  # artifact-guarded, coverage-corroborated D/E fallback when EBITDA is unavailable.
  # Remove this whole block for the byte-identical pre-feature gate (raw D/E > max).
  # All values are UNFITTED priors — backtest the net_debt_to_ebitda axis before trusting.
  leverage:
    enabled: true
    max_net_debt_to_ebitda:         4.0   # >4x net leverage -> over-levered
    min_ebitda_margin:              0.03  # below this margin EBITDA is too small to trust -> fall back
    dte_artifact_ceiling:           20.0  # D/E above this is an equity-distortion artifact -> abstain
    min_interest_coverage_for_gate: 2.0   # fallback trips only when EBIT covers interest < this
  # Stage-aware FCF gate (§2.7). Shipped ON. A negative-FCF name is excused when its
  # growth is strong AND sustained. Remove the block for the pre-feature hard gate.
  fcf:
    enabled: true
    excuse_min_revenue_cagr:  0.15
    excuse_min_persistence:   0.70

# Sector applicability (SIC -> bucket). v1 MASKS structurally-undefined legs/gates
# for spread/deposit/property businesses; it does NOT recalibrate surviving bands
# (that is deferred mode-2 work). `buckets` is an ORDERED LIST: the first bucket
# whose inclusive SIC range contains the code wins. Detection is EDGAR-sourced;
# unknown -> no masking (a bit-identical no-op).
# See docs/superpowers/specs/2026-06-02-sector-aware-abstention-design.md.
sectors:
  buckets:
    - name: reit
      sic_ranges: [[6798, 6798]]
    - name: insurer
      sic_ranges: [[6300, 6399], [6411, 6411]]   # carriers (life/health/P&C/title/surety) + agents
    - name: financials                            # depository banks, nondepository credit, broker-dealers, holdings
      sic_ranges: [[6020, 6099], [6120, 6179], [6199, 6199], [6211, 6211], [6712, 6712]]
  # Legs that are undefined / non-representative for the bucketed institutions.
  # net_margin is intentionally NOT masked (it is defined, only miscalibrated -> deferred).
  # Exchanges (6231), advisers/asset managers (6282), funds (672x), SPACs (6770) and
  # real-estate operators (65xx) are deliberately NOT bucketed -> unknown -> unmasked.
  # asset_growth / accruals are balance-sheet legs undefined/non-representative for
  # financials & REITs (lumpy AUM/loan books, externally-financed asset growth) -> masked
  # on the production path. The backtest axis stays unmasked (sic=None) for raw-IC comparability.
  # shareholder_yield (§5) is likewise masked for financials: bank capital returns ride
  # regulatory (CCAR/SCB) cycles & loan-book debt flows distort the net-debt leg; the
  # backtest axis stays unmasked (sic=None).
  masked_legs:  [gross_margin, gross_margin_stability, roic, fcf_yield, fcf_cagr, interest_coverage, debt_to_equity, piotroski_f, asset_growth, accruals, shareholder_yield]
  masked_gates: [negative_fcf, over_leveraged]

validity:
  # Bucket-gated: floors apply ONLY to known buckets; 'unknown' stays bit-identical
  # to pre-change behavior (any present leg scores; composite is always 'scored').
  min_valid_leg_fraction: 0.5   # known-bucket sub-score needs >= half its APPLICABLE legs present
  unknown_min_present_legs: 1   # unknown: any present leg scores (no-op back-compat)
  min_scored_weight:      0.25  # known-bucket composite 'scored' iff present/applicable component weight >= this.
                                # Lowered 0.34->0.25 for the value/momentum split: a gated financials name with
                                # only momentum+insider present sits at 0.287 and must still rank (spec 2026-06-02).
  min_composite_components: 1   # ALL buckets, including 'unknown'. A composite must rest on at least this many
                                # real sub-scores. `risk` is a composite-only TILT and does not count — a card
                                # with every component null still posts a composite from the tilt alone (BRVE,
                                # 2026-08-10: composite 100.0, ranked #1, because it reports no debt).
                                # Deliberately a COUNT, not a weight: a momentum-only name sits at confidence
                                # ~0.08 and is pinned as scored, so no weight threshold separates the two
                                # safely. Remove the key for the exact pre-2026-08-11 behaviour.

# Soft, NON-disqualifying advisories (parallel to `gates` — never change composite/passed).
# crowded_short fires only with the `finra` source present.
flags:
  crowded_short:
    min_short_pct_outstanding: 0.10   # of shares OUTSTANDING (under-states float; a PRIOR, not fitted)
    min_days_to_cover: 5.0            # >5 elevated, >10 extreme
    require_rising: true              # the change (vs prior cycle), not the static level, is the signal
    max_staleness_days: 35            # ignore a cycle older than ~2 missed publications (stale-cache guard)
  # Insider conviction advisories (soft; never affect passed/composite). Inert unless
  # the insider.conviction block is enabled (the fields stay None otherwise).
  insider_cluster_buy: { min_distinct: 3 }
  planned_sale:        { min_value: 1 }
  cash_burn:           { enabled: true }   # advisory whenever FCF is negative (presence-based)
  # Dilution advisory: persistent net share issuance (ASSESSMENT_GAPS §2.5). Soft —
  # never affects passed/composite/scored. Fires off share_count_cagr (diluted
  # weighted-avg share count). UNFITTED prior.
  dilution:            { min_share_cagr: 0.03 }   # >= +3%/yr diluted-share growth
  # Soft value-trap advisory: a name that looks cheap (high value sub-score) while
  # its quality OR growth is weak. Level-based proxy (no deterioration trend without
  # snapshot history). Advisory only — never affects passed/composite/scored.
  # All three are UNFITTED priors — backtest before trusting.
  value_trap:
    min_value_score:   60
    max_quality_score: 40
    max_growth_score:  40
    # OPTIONAL fundamental-quality refinement. ABSENT by default -> value_trap is
    # byte-identical to the pre-feature scorer. Uncomment to let the Piotroski-inspired
    # score suppress the flag on cheap-but-improving names and confirm it on
    # cheap-but-deteriorating ones. UNFITTED priors.
    # piotroski:
    #   suppress_at: 0.83   # cheap + fraction >= this (>=5/6) -> NOT a trap. High on purpose:
    #                       # requires the F4-F6 trend legs, not just the correlated F1-F3
    #                       # going-concern block (audit Sev2). Suppression removes a risk flag.
    #   confirm_at:  0.40   # cheap + fraction <= this (<=2/6) -> trap even if quality/growth ok
    #   min_legs:    4      # abstain when fewer than this many of the 6 tests evaluable
  # Social-media hype advisory (WSB via ApeWisdom; harness engine + `wsb` source).
  # Soft — never affects passed/composite/scored. Fires on rising mention velocity
  # above an absolute floor. All UNFITTED priors (live WSB top-name volume was
  # ~50-100 mentions on 2026-06-07; tune by regime).
  social_hype:
    min_mentions: 50            # absolute floor (ignore low-chatter names)
    min_mention_delta_pct: 0.5  # +50% mentions vs 24h ago (velocity); skipped when no 24h baseline
    require_rising: true        # the change, not the static level, is the signal
    max_staleness_days: 2       # ignore data older than ~2 days (stale-cache guard)
  # news_spike: elevated AND rising mainstream news flow (Finnhub company-news).
  # Advisory only; never affects passed/composite. UNFITTED priors.
  news_spike:
    min_count_7d: 10           # absolute floor: >=10 articles in the last 7d
    require_rising: true       # last-7d count > the prior 7d (the change is the signal)
    max_staleness_days: 3      # ignore if the newest article is older than ~3 days
  # filing_text_change ("Lazy Prices", Cohen-Malloy-Nguyen 2020): a big YoY change in
  # the 10-K/10-Q risk-factor + MD&A language predicts negative returns. Fires when the
  # point-in-time cosine similarity vs the immediately-prior same-type filing is BELOW
  # max_similarity. Advisory only; never affects passed/composite/scored. The similarity
  # is computed on the research / accumulation path (full filing text is NOT in the
  # per-ticker harness snapshot), so this is a no-op on a plain screen. UNFITTED prior —
  # remove this whole block for the byte-identical pre-feature scorer.
  filing_text_change:
    max_similarity: 0.7        # similarity < 0.7 (>~30% rewritten) -> flag
  # Advisory only: in a risk-off regime, flag leveraged names. The cyclical arm is
  # a forward-compatible hook — it ships EMPTY because sectors.buckets defines only
  # reit/insurer/financials (no cyclical buckets yet); a cyclical name resolves to
  # "unknown" and would never match. Populate once cyclical SIC buckets exist.
  risk_off_regime:
    max_net_debt_ebitda: 3.0
    max_debt_to_equity: 1.5
    cyclical_buckets: []

fmp:
  # The /stable/ insider-trading endpoint is paid (402 on free plans) and EDGAR is
  # the free, authoritative insider source — so leave this off to avoid burning a
  # guaranteed-to-fail request per ticker against the daily quota. Flip to true only
  # on a paid FMP tier where the endpoint actually returns data.
  fetch_insider: false
  # Retries on a 429 (per-minute throttle) before giving up; backoff honors any
  # Retry-After header. Daily-quota 429s won't clear, so this is deliberately small.
  max_retries: 2

# Insider CONVICTION enrichment (ASSESSMENT_GAPS §2.6). DISABLED by default: leave the
# block commented so insider_score and check_gates are byte-identical to the pre-feature
# scorer. All numbers are UNFITTED priors — backtest before trusting.
# insider:
#   conviction:
#     enabled: true
#     min_cluster_buy_value: 25000      # per-buyer $ floor to count toward a cluster
#     planned_sell_discount: 0.5        # forgive 50% of detected-10b5-1 sell drag
#     role_weights:
#       c_suite:  1.5
#       officer:  1.2
#       director: 1.0
#       ten_pct:  0.5
#       unknown:  1.0                   # missing role == neutral (load-bearing for back-compat)

# Earnings-quality / dilution SCORING (ASSESSMENT_GAPS §2.5). DISABLED by default:
# leave commented so quality_score and growth_score are byte-identical to the
# pre-feature scorer (the share_count_cagr signal + dilution flag are
# still surfaced/evaluated regardless). When enabled, quality gains an inverted
# share_count_cagr leg (serial diluters score below buyback compounders) and the
# growth eps_cagr leg switches from the net-income proxy to genuine per-share
# diluted-EPS CAGR. UNFITTED priors — backtest before trusting.
# CAVEAT (docs/PLAN_EDGAR_ROOT_CAUSE_B.md fix-wave item 2): pre-deploy accumulation
# snapshots lack `diluted_shares` for 8 large caps (CMCSA CVX GOOGL HON LMT MO MRK
# PG) recovered by the companyconcept fallback -- date-gate or exclude them before
# fitting/enabling this leg against accumulated history, or the mid-panel
# field-presence break will bias a walk-forward fit.
# quality:
#   dilution:
#     enabled: true

# Investment & earnings-quality SCORING (PREDICTIVE_SIGNALS §3). BOTH legs now OFF
# (measured-but-not-scored). The accruals leg (Sloan 1996) was enabled 2026-06-21 on a
# single ad-hoc 195-name universe (XS-IC +0.036 t=2.1 @3m) whose composition + results doc
# are gitignored and no longer exist. A 2026-07-12 re-measurement on the committed,
# reproducible universes DISABLED it: positive-signed but SUB-SIGNIFICANT on largecap
# (t=1.1–1.5 @1–12m, hit up to 0.66) and FLAT-to-negative on the 231-name combined run
# (XS-IC ~0.000, t~-0.05 @1–6m) — it never clears t~2 on any reproducible universe, and was
# flat/negative in small/mid caps where it still moved live scores. Evidence:
# docs/audits/2026-07-12-accruals-leg-disable.md. The sibling asset_growth leg (Cooper-Gulen-
# Schill 2008) stays OFF too (XS-IC -0.006, t=-0.3). Both remain measured in the backtest,
# just not scored; both INVERTED (high -> lower score). Per-leg keys default True when absent.
# (If both quality blocks are wanted, merge them under one `quality:` mapping.)
quality:
  earnings_quality:
    enabled: true
    asset_growth: false   # no cross-sectional edge (XS-IC -0.006 t=-0.3) — measured-but-off
    accruals: false       # re-measured 2026-07-12: sub-significant on largecap, flat combined — measured-but-off

# Total-shareholder-yield SCORING (PREDICTIVE_SIGNALS §5; Boudoukh et al. 2007 / Faber).
# DISABLED by default: leave commented so value_score is byte-identical to the pre-feature
# scorer (the shareholder_yield signal is still surfaced + backtest-measured regardless).
# When enabled, value gains one STRAIGHT (non-inverted) leg — (dividends + net buybacks +
# net debt reduction) / market_cap: names returning more cash to owners score higher. The
# net-debt leg is signed (a net debt ISSUER scores below 0% yield). UNFITTED prior —
# backtest the rank IC + its collinearity vs fcf_yield / share_count before trusting.
# value:
#   shareholder_yield:
#     enabled: true

# SUE / post-earnings-announcement-drift SCORING (PREDICTIVE_SIGNALS §1; Bernard-Thomas
# 1989, Novy-Marx 2015). DISABLED by default: leave commented so momentum_score is byte-
# identical to the pre-feature scorer (the SUE signal is still surfaced + snapshot-replay-
# backtest-measured regardless). When enabled, momentum gains one STRAIGHT leg — the
# decayed, dispersion-standardized last surprise (SUE = last_surprise_% / own-σ): a fresh
# beat tilts momentum up, a fresh miss down. MANDATORY σ-GUARD: the leg ABSTAINS when the
# firm has < min_quarters usable surprises or its surprise dispersion is below sigma_floor
# percentage points (the all-equal / 4-equal case has σ≈0 -> never divide to inf/NaN). The
# leg DECAYS linearly to 0 over decay_trading_days since the LAST (announced) report — it
# is keyed off earnings_days_since_last_report, NEVER days-to-next (that report is
# unannounced -> look-ahead). UNFITTED priors — backtest before trusting.
# momentum:
#   sue:
#     enabled: true
#     decay_trading_days: 60     # post-announcement drift window (Bernard-Thomas ~60d)
#     sigma_floor: 1.0           # min surprise dispersion (pct points) below which SUE abstains
#     min_quarters: 3            # min usable past surprises required to standardize

# Residual (idiosyncratic) MOMENTUM SCORING (PREDICTIVE_SIGNALS §2; Blitz-Huij-Martens
# 2011). ENABLED: momentum gains one STRAIGHT leg — the 12-1 momentum of CAPM (vs SPY)
# residuals, standardized by residual vol: a stock trending up AFTER its market beta is
# stripped out scores higher. RATIONALE: the LIVE-price backtest validated it as the only
# new signal with a significant cross-sectional t-stat — 1-month XS rank-IC +0.023, t=2.6 —
# while RAW momentum is anti-predictive there (TS-IC -0.03, t=-3.9). HONEST CAVEAT: this is
# a SHORT-HORIZON signal — its edge decays past ~3 months, so it is a de-betaed near-term
# tilt, not a long-hold thesis. The leg now FIRES on live screens: m.residual_momentum is
# populated from the date-aligned stock+SPY Yahoo series (data/sources.py:YahooSource.fetch
# plumbs bar dates; was backtest-seam-only). The leg ABSTAINS (drops, never divides by 0) on
# a thin/flat/date-less price window. COMMENT OUT the block below for a byte-identical
# pre-feature momentum_score.
momentum:
  residual:
    enabled: true

# Default source chain for the harness (yahoo first => wins the price merge). Used
# whenever `--provider` is omitted; passing `--provider` overrides this list, so omit
# it to keep yahoo/finra.
harness_sources: [yahoo, fmp, finnhub, edgar, finra, wsb, gov_contracts, lobbying]

# Persistent HTTP-response cache for the FMP/Finnhub sources. On by default so
# repeated ad-hoc runs stop burning the free-tier daily quota. Disable per-run with
# --no-cache; force-repopulate with --refresh-cache. TTLs are per data half-life
# (seconds). See docs/DATA_SOURCES.md §6.
cache:
  enabled: true
  path: .cache/http.sqlite
  ttl:
    quote: 21600         # 6h  — quotes, price-change, live metric
    fundamentals: 86400  # 1d  — ratios, key-metrics
    analyst: 86400       # 1d  — grades, targets, recommendations, insider-sentiment
    statements: 604800   # 7d  — income/balance/cashflow (change only on a filing)
    profile: 604800      # 7d  — company profile
    default: 86400       # 1d  — any unmapped endpoint

# Qualitative research layer (shortlist --research N). Uses the `claude` CLI.
research:
  model: claude-sonnet-5       # pinned to a family, not the cross-version "sonnet" alias.
                               # NOTE: tracks the latest snapshot in the family, not a frozen
                               # date-pinned build; brief reproducibility is anchored by the
                               # wide cache key (research/cachekey.py — filing accessions +
                               # prompt/config fingerprint + context digest + day bucket),
                               # not the model string.
                               # Set 2026-08-05 as a DELIBERATE JUDGMENT CALL, not a
                               # measurement — see the audit doc D9 and TODO.md. Two
                               # consequences worth keeping in mind:
                               #   1. Sonnet 5 tokenizes the same text to ~30% more tokens than
                               #      the prior generation, so per-brief cost rises even though
                               #      the sticker price is unchanged. Not yet measured on a real
                               #      ~127K-char brief prompt.
                               #   2. The SYSTEM_PROMPT was tuned against the prior generation.
                               #      Sonnet 5 follows instructions more literally, so watch the
                               #      first refreshed briefs for over-applied length/scope
                               #      directives.
  timeout_s: 900               # generous ceiling; NVDA ~246s, CVX ~400s on the VPS, but a HEAVY
                               # filer (WDC: 178K-char prompt) measured ~490s and intermittently
                               # spilled past the old 600s ceiling (all 3 attempts timed out
                               # 2026-06-29) -> "research unavailable". 900s gives headroom over
                               # the worst observed brief. Keep max_attempts x timeout_s below
                               # bot.research_phase_budget_s.
  max_attempts: 3              # total assess() tries (transient CLI timeouts + reparse retries).
                               # A single claude call still intermittently exceeds timeout_s; that
                               # failure is transient, so retry instead of dropping the brief.
                               # Worst case ~ max_attempts x timeout_s of wall-clock per ticker —
                               # keep <= bot.research_phase_budget_s.
  fallback_model: claude-opus-5   # --fallback-model on the claude CLI. Without it an
                               # overloaded primary fails all max_attempts identically and the
                               # brief is dropped ("research unavailable"). Must differ from
                               # `model` above to do anything — falling back to the same model
                               # just retries something unavailable, which max_attempts already
                               # does. Opus 5 is the deliberate choice: it only fires when
                               # Sonnet 5 is unavailable (rare), and a costlier brief beats no
                               # brief. A fallback-produced brief is labelled with the model
                               # that actually ran (claude_cli._answering_model), so the corpus
                               # stays auditable.
                               # Remove the key for the byte-identical pre-feature argv.
  output_root: research        # artifacts: research/<TICKER>/<key>.{md,json}, where <key> is
                               # the wide cache key (accession-p<fingerprint>-c<digest>-<day>),
                               # not the bare filing accession — see research/cachekey.py.
  cache:                       # brief staleness (docs/PLAN_DEEP_FRESHNESS.md §4)
    max_age_days: 1            # day bucket; 0 = content-addressed only, no time decay.
                               # 0 also freezes the macro line: only `macro.regime` is
                               # hashed in context_digest, but _macro_line (assess.py:
                               # 265-282) prints five rate levels (10y, 10y-2y, HY OAS,
                               # VIX, fed funds) that can all move while regime does not.
    price_band_pct: 0.03       # regenerate when price/market cap moves ~3%. 0 means
                               # price/market_cap DROP OUT of the digest entirely (band<=0
                               # short-circuits _band() to None) — i.e. price never busts
                               # the key on its own, NOT "bust on any move".
  max_risks: 12
  max_red_flags: 12
  max_conflicts: 6             # cap on reconciliation entries (truncation budget)
  max_moat_sources: 6          # cap on moat.sources — quoted claims, so uncapped growth
  max_management_findings: 6   # eats OUTPUT tokens, and assess.py returns None (drops the
                               # brief, unretried) on stop_reason == max_tokens
  max_falsifiers: 6            # cap on thesis.what_would_change_my_mind
  max_added_risks: 8           # cap on the YoY newly-disclosed-risks list (§3.4)
  risk_diff:                   # YoY Item-1A risk-factor diff (research/riskdiff.py)
    similarity_threshold: 0.5  # normalized block-prefix SequenceMatcher ratio; below => "added"
    max_blocks: 4              # cap added risk blocks fed to the model
    max_chars: 12000           # total char cap on the added-risk text
  max_chars:                   # cap 10-K narrative sections fed to the model (chars).
    business: 50000            # generous context now that timeout_s has headroom. MD&A kept
    mda: 60000                 # largest (highest-signal). risk_factors is boilerplate, ordered
    risk_factors: 50000        # worst-first, so a prefix slice keeps the material risks.
    tenq_mda: 40000            # cap the latest 10-Q MD&A prompt section (§3.1). NOTE this cap
                               # is load-bearing beyond prompt size: JPM's Part I Item 2
                               # extraction measured 601,221 chars (a whole-document
                               # over-capture) on 2026-08-14, so the section fed to the model is
                               # its first 40K. See TODO.md §2a.
  tenq_risk_update:            # 10-Q Part II Item 1A — the quarter's risk-factor CHANGES,
                               # diffed against the 10-K Item 1A (research/filings.py:
                               # _tenq_added_risks). Filing text, so it enters the grounding
                               # haystack as its own labelled segment. NOT a scored signal.
    enabled: true              # flip false (or remove the block) for a byte-identical no-op
    max_blocks: 4              # diff blocks kept, worst-first (riskdiff semantics)
    max_chars: 4000            # measured ceiling across 10 large caps was 2,949 chars (NVDA)
                               # AFTER the diff; the RAW section runs to 84,281 (GILD), which
                               # is precisely why this is a diff and not the raw Item 1A.
  screening_call:              # buy/hold/avoid capstone on the research brief (spec 2026-06-07)
    enabled: true              # defaults ON; flip false for a byte-identical no-op
    labels:
      STRONG_BUY: "Strong Buy"
      BUY: "Buy"
      HOLD: "Hold"
      AVOID: "Avoid"
      STRONG_AVOID: "Strong Avoid"
    disclaimer: "screen only — not advice"  # tag on every standalone surface
    gate_clamp:                # gate name -> most-bullish stance allowed when tripped
      _default: HOLD
      negative_fcf: AVOID
      over_leveraged: AVOID
    conviction_cap:
      low_below: 0.45          # confidence below this -> LOW
      medium_below: 0.70       # confidence below this -> at most MEDIUM
    high_conviction:
      contra_flags: [value_trap]  # flags that block HIGH on a bullish call
  reverse_dcf:                 # price-implied FCF growth line in the brief (research-only;
                               # NOT a scored signal — see docs/.../2026-06-13-reverse-dcf-*).
    enabled: true              # flip false for a byte-identical no-op (line omitted)
    discount_rate: 0.10        # cost-of-equity prior (long-run equity return); the only model knob
    base_years: 3              # FCF normalization window (median of positive years)
    run_rate_flag_ratio: 1.5   # flag the line when latest FCF > this x base (run-rate caveat)
    display_floor: -0.50       # clamp display; below => "distressed/special-situation"

  gov_contracts:               # USAspending gov-contracts context line (research-only;
                               # NOT a scored signal — see docs/.../2026-06-15-gov-contracts-*).
    enabled: true              # flip false for a byte-identical no-op (line omitted)
    min_confidence: 0.80       # render floor: omit the line below this recipient-match confidence

  lobbying:                    # federal lobbying-spend context line (research-only;
                               # NOT a scored signal — see docs/.../2026-06-15-lobbying-*).
    enabled: true              # flip false for a byte-identical no-op (line omitted)
    min_confidence: 0.85       # render floor: omit the line below this client-match confidence

  earnings:                    # earnings-surprise history + next-report line (research-only;
                               # NOT a scored signal — see docs/.../2026-06-15-earnings-surprise-*).
    enabled: true              # flip false for a byte-identical no-op (line omitted)


  insider_detail:              # recent Form-4 trades as a brief context line (enrichment;
                               # prompt-only, NOT a scored signal — 2026-06-15-research-insider-detail).
    enabled: true              # flip false for a byte-identical no-op (line omitted)
    max_items: 6               # cap recent trades listed (newest-first)

  macro:                       # run-level macro backdrop line (research-only; prompt-only,
                               # NOT the grounding haystack, NOT a scored signal). The
                               # MacroContext is already fetched per run — this only
                               # threads it into the brief, which previously reasoned about
                               # a discount rate and leverage with no rate/credit context.
                               # Fixed template, not free text: the bar is "changes how THIS
                               # company's numbers read", not market-timing prose.
    enabled: true              # flip false (or remove the block) for a byte-identical no-op

  eightk:                      # recent 8-K SUBSTANCE in the brief (research/eightk.py; design +
                               # 60-filing evidence: docs/audits/2026-08-13-eightk-text-in-deep-design.md).
                               # Unlike the context lines above this IS filing text, so it enters
                               # the grounding haystack — as its own labelled segment, so a verified
                               # quote is attributed to the 8-K, not to the 10-K. NOT a scored
                               # signal, no gate, no flag: /deep prompt + report only.
    enabled: true              # flip false (or remove the block) for a byte-identical no-op
    lookback_days: 120         # window on the DEDICATED form="8-K" index — NOT m.filing_events,
                               # whose 40-row mixed index collapsed to 26 days on JPM and dropped
                               # its Item 2.02 earnings release entirely (spec F1)
    max_filings: 3
    max_chars_total: 10000     # normalized chars, POST whitespace-collapse (which alone recovers
                               # 47-85% of exhibit bytes). ~8% longer prompts; a 30K variant was
                               # ~25% and pushed a heavy filer toward the timeout_s ceiling above.
    max_chars_per_filing: 6000 # EX-99 normalized length measured 1,938-47,906 chars, median ~26K,
                               # so this binds on most earnings releases by design: the goal is
                               # capturing what is NEW, not capturing the whole release.
    guidance_window_chars: 1500  # spliced around a late outlook/guidance hit the prefix would lose
                               # (2 of 23 measured releases place "Outlook" AFTER the financial
                               # tables — JPM at 0.45, CVX at 0.41 of the document). The one
                               # heuristic here, fitted to n=2, and a TRADE: the window displaces
                               # prefix chars inside the same cap. Set 0 to drop it first.
    items: ["4.02", "2.02", "2.01", "1.01", "5.02"]   # priority order, best-first. 4.02 outranks
                               # 2.02 because a non-reliance restatement unconditionally stops a
                               # thesis. An 8-K with none of these keeps today's bare form label.

  proxy:                       # DEF 14A compensation & governance context line (research-only;
                               # prompt-only, NOT a scored signal — see 2026-06-27-def14a-proxy-reader).
                               # Structured XBRL (pay-vs-performance, ownership, pay slice); fetched
                               # per deep-dive in the research layer, NOT on every screen's snapshot.
    enabled: true              # flip false (or remove the block) for a byte-identical no-op
    max_holders: 3             # cap on 5%+ beneficial holders named (largest-first)
    control_pct: 30.0          # a holder >= this % triggers the concentrated-control note (percent units)
# Government contracts (harness GovContractsSource, USAspending). Keyless aux source;
# flat data + a research context line only (no sub-score, no flag in v1) — see
# docs/superpowers/specs/2026-06-15-gov-contracts-source-design.md.
gov_contracts:
  trailing_months: 24
  match_min_confidence: 0.80   # validated against the labeled set (tests/test_govcontract_match.py)
  max_pages: 5                 # page cap on spending_by_transaction (sorted by amount desc)
  cache_dir: .cache/usaspending
  timeout: 20

# Federal lobbying (harness LobbyingSource, Senate LDA). Keyless aux source; flat data
# + a research context line only (no sub-score, no flag in v1) — see
# docs/superpowers/specs/2026-06-15-lobbying-source-design.md.
lobbying:
  base_url: https://lda.gov/api/v1   # lda.senate.gov retired after 2026-06-30
  trailing_months: 24
  match_min_confidence: 0.85   # client.name vs SEC registrant title
  max_pages_per_year: 4        # page cap per calendar year (25 filings/page)
  cache_dir: .cache/lda
  timeout: 20

# EDGAR filing-stream events (harness EdgarSource). Advisory flags only — see
# docs/superpowers/specs/2026-06-01-edgar-events-design.md.
edgar_events:
  lookback_days: 90
  index_limit: 40
  # /A amendments are auto-included by edgartools; SCHEDULE 13D/13G spellings are
  # listed explicitly because the fetch filter is exact-match (see spec section 3.1).
  # 10-Q/10-K feed only the SUE decay anchor (events.last_report_filed) — they never
  # join the advisory `recent` list, and their /A amendments are dropped in the builder.
  forms: ["8-K", "SC 13D", "SC 13G", "144", "SCHEDULE 13D", "SCHEDULE 13G", "10-Q", "10-K"]
  soft_notes:        # reserved; all OFF in v1 (pure enrichment)
    stale_after_8k: false
    activist_13d_note: false

# Telegram bot (shortlist-bot): /screen, /deep, and the position store.
bot:
  poll_timeout_s: 25        # getUpdates long-poll seconds
  max_screen: 10            # max tickers accepted by one /screen
  max_deep: 3               # max tickers accepted by one /deep (each is a Claude call)
  deep_screen_sources: [yahoo, fmp, finnhub, edgar, finra, wsb]
  research_top_n: 3             # names sent to the research layer per /deep
  research_phase_budget_s: 2800 # wall-clock ceiling for the whole research phase

ranking:
  thin_below: 0.40  # mark a card "thin" when confidence < this. Omit/null to disable.
                    # Lowered 0.5->0.40 alongside the value/momentum split (spec 2026-06-02).

# Run-level macro/credit-regime overlay via the official FRED API (needs a free
# FRED_API_KEY — the keyless fredgraph.csv host is IP-blocked on datacenter IPs).
# Display + advisory only — never affects composite/gates/ranking. See data/macro.py.
macro:
  enabled: true
  series:
    dgs10: DGS10            # 10y treasury yield (%)
    t10y2y: T10Y2Y          # 2s10s curve (%)
    hy_oas: BAMLH0A0HYM2    # ICE BofA US HY OAS (%)
    vix: VIXCLS
    fedfunds: FEDFUNDS      # fed funds (%)
  risk_off: { hy_oas: 5.0, t10y2y: 0.0, vix: 25.0 }   # any one trips risk-off
  risk_on:  { hy_oas: 3.5, vix: 18.0 }                # unfitted priors

# --- portfolio-awareness (bot /portfolio) ---
portfolio:
  path: portfolio.csv      # legacy CSV — no longer read (superseded by the store)
  store: positions.json    # bot-owned source of truth (gitignored); atomic writes
  decisions: decisions.jsonl   # append-only decision ledger (gitignored)
  max_holdings: 50         # safety cap; over this, screen the cap + WARN (never silent-drop)
