[project]
name = "shortlist"
version = "0.1.0"
description = "Stock screener that ranks a ticker list on quality, moat, growth, value, momentum and insider activity from SEC EDGAR, Yahoo Finance, FMP and Finnhub"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Chris Turgeon" }]
keywords = [
    "stock-screener", "stocks", "investing", "value-investing", "fundamental-analysis",
    "quantitative-finance", "factor-investing", "sec-edgar", "xbrl", "backtesting",
    "telegram-bot", "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/christurgeon/shortlist"
Documentation = "https://github.com/christurgeon/shortlist#readme"
Issues = "https://github.com/christurgeon/shortlist/issues"

[project.optional-dependencies]
edgar = ["edgartools>=5.61"]
fred = ["fredapi>=0.5"]
bot = ["pillow>=10.0"]   # report dashboard PNG

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.10"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: hits real external APIs; skipped unless -m live"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    ".claude",             # transient git worktrees, not part of this project
    "docs/audits/scripts", # one-off probes preserved AS RUN — they are the evidence
                           # behind an audit note, so reformatting them would edit the
                           # record. CI lints `src tests` only, so these never gated
                           # anything; the exclude just stops a bare `ruff check .`
                           # from reporting failures nobody is allowed to fix.
]

[tool.ruff.lint]
# Curated for signal, not churn: pyflakes/pycodestyle defaults plus bugbear,
# comprehension, simplify and import-sort. Pyupgrade (Optional -> | None) is
# deliberately omitted — it would rewrite ~300 annotations for no behaviour gain.
select = ["E", "F", "W", "I", "B", "C4", "SIM", "PIE", "C901"]
ignore = [
    "E501",    # long lines are dense-by-design here; we don't reflow
    "SIM103",  # explicit multi-return guards read clearer than one negated return
    "SIM108",  # nested ternaries are less readable than the if/else blocks here
    "B027",    # empty non-abstract lifecycle hooks (e.g. Source.aclose) are intentional
]

[tool.ruff.lint.mccabe]
# A ratchet, not an aspiration. 20 is the tightest ceiling the tree passes with
# only THREE exemptions, and they carry a per-function `# noqa: C901` at the def
# rather than a per-file ignore, so the rest of those files stays covered:
#   bridge.snapshot_to_metrics (47) — order-dependent pipeline; PR #145 measured
#     the split and deliberately declined it (TODO.md §6).
#   backtest/cli.py:main (36)       — argparse surface, flat dispatch.
#   research/assess.py:_quant_context (21) — one optional prompt line per branch.
# Pinning at 47 instead would have been no guardrail at all: it would let every
# OTHER function grow to 47 unnoticed, which is the failure this rule exists to
# catch. Raise this number only with a reason; adding a fourth noqa is the
# cheaper answer, and a fifth is the signal that something needs splitting.
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# Test files use deliberate task-section structure: mid-file imports, re-imports,
# lambda fakes and compact one-line stubs. Don't fight that.
"tests/**" = ["E402", "E731", "F811", "F841", "E401", "E702", "I", "C408"]
# mock.py uses dict(k=v, ...) as readable tabular record literals on purpose.
"src/shortlist/providers/mock.py" = ["C408"]

[project.scripts]
shortlist = "shortlist.screen:main"
shortlist-harness = "shortlist.data.cli:main"
shortlist-backtest = "shortlist.backtest.cli:main"
shortlist-accumulate = "shortlist.data.accumulate:main"
shortlist-bot = "shortlist.bot.telegram:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Without this a built wheel has no table and the /deep ROIC-persistence section reads
# "not shown" for every name. The deploy is an editable install and does not need it.
[tool.setuptools.package-data]
shortlist = ["durability_table.json"]
