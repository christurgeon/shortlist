[project]
name = "shortlist"
version = "0.1.0"
description = "Moat + momentum/value + insider stock screener feeding the investment-research skill"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Chris Turgeon" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
edgar = ["edgartools>=3.0"]
fred = ["fredapi>=0.5"]
scout = ["pillow>=10.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.10"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: hits real external APIs; skipped unless -m live"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".claude"]  # transient git worktrees, not part of this project

[tool.ruff.lint]
# Curated for signal, not churn: pyflakes/pycodestyle defaults plus bugbear,
# comprehension, simplify and import-sort. Pyupgrade (Optional -> | None) is
# deliberately omitted — it would rewrite ~300 annotations for no behaviour gain.
select = ["E", "F", "W", "I", "B", "C4", "SIM", "PIE"]
ignore = [
    "E501",    # long lines are dense-by-design here; we don't reflow
    "SIM103",  # explicit multi-return guards read clearer than one negated return
    "SIM108",  # nested ternaries are less readable than the if/else blocks here
    "B027",    # empty non-abstract lifecycle hooks (e.g. Source.aclose) are intentional
]

[tool.ruff.lint.per-file-ignores]
# Test files use deliberate task-section structure: mid-file imports, re-imports,
# lambda fakes and compact one-line stubs. Don't fight that.
"tests/**" = ["E402", "E731", "F811", "F841", "E401", "E702", "I", "C408"]
# mock.py uses dict(k=v, ...) as readable tabular record literals on purpose.
"src/shortlist/providers/mock.py" = ["C408"]

[project.scripts]
shortlist = "shortlist.screen:main"
shortlist-harness = "shortlist.data.cli:main"
shortlist-backtest = "shortlist.backtest.cli:main"
shortlist-accumulate = "shortlist.data.accumulate:main"
shortlist-scout = "shortlist.scout.daily:main"
shortlist-bot = "shortlist.scout.bot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
