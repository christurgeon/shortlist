[project]
name = "shortlist"
version = "0.1.0"
description = "Moat + momentum/value + insider stock screener feeding the investment-research skill"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Chris Turgeon" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
edgar = ["edgartools>=3.0"]
fred = ["fredapi>=0.5"]
scout = ["pillow>=10.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: hits real external APIs; skipped unless -m live"]

[project.scripts]
shortlist = "shortlist.screen:main"
shortlist-harness = "shortlist.data.cli:main"
shortlist-backtest = "shortlist.backtest.cli:main"
shortlist-accumulate = "shortlist.data.accumulate:main"
shortlist-scout = "shortlist.scout.daily:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
